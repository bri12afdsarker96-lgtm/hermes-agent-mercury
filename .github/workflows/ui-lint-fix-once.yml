name: UI lint fix once

on:
  push:
    branches:
      - claude/p3-m4a-ui-design-system-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/p3-m4a-ui-design-system-01
          fetch-depth: 0

      - name: Apply exact lint-only patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          kb = Path('apps/desktop/src/plugins/enterprise-console/page-knowledge.tsx')
          s = kb.read_text(encoding='utf-8')
          old = "import { CapabilityBadge, PageStatusBadge } from './status-badge'\nimport { PageHeader } from './ui'\nimport { useTransport } from './transport'"
          new = "import { CapabilityBadge, PageStatusBadge } from './status-badge'\nimport { useTransport } from './transport'\nimport { PageHeader } from './ui'"
          assert s.count(old) == 1, 'knowledge import block drifted'
          kb.write_text(s.replace(old, new), encoding='utf-8')

          test = Path('apps/desktop/src/plugins/enterprise-console/form-flows.test.tsx')
          t = test.read_text(encoding='utf-8')
          old_assert = "    expect(document.body.textContent).not.toContain('sk-sensitive-value')"
          new_assert = "    expect(screen.queryByDisplayValue('sk-sensitive-value')).toBeNull()"
          assert t.count(old_assert) == 1, 'provider secret assertion drifted'
          test.write_text(t.replace(old_assert, new_assert), encoding='utf-8')
          PY

      - name: Commit fixes and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/plugins/enterprise-console/page-knowledge.tsx \
                  apps/desktop/src/plugins/enterprise-console/form-flows.test.tsx
          git rm .github/workflows/ui-lint-fix-once.yml
          git commit -m 'fix(ui): satisfy enterprise console lint gate'
          git push origin HEAD:claude/p3-m4a-ui-design-system-01
