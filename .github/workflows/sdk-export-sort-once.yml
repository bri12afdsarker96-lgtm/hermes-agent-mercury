name: Sort Sheet SDK export once

on:
  push:
    branches:
      - claude/p3-m4a-ui-design-system-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/p3-m4a-ui-design-system-01
          fetch-depth: 0
      - name: Move Sheet export after dropdown menu
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src/sdk/index.ts')
          s = p.read_text(encoding='utf-8')
          sheet = "export {\n  Sheet,\n  SheetClose,\n  SheetContent,\n  SheetDescription,\n  SheetFooter,\n  SheetHeader,\n  SheetTitle,\n  SheetTrigger\n} from '@/components/ui/sheet'\n"
          dropdown = "export {\n  DropdownMenu,\n  DropdownMenuContent,\n  DropdownMenuItem,\n  DropdownMenuSeparator,\n  DropdownMenuTrigger\n} from '@/components/ui/dropdown-menu'\n"
          old = sheet + dropdown
          new = dropdown + sheet
          assert s.count(old) == 1, 'SDK export order drifted'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/sdk/index.ts
          git rm .github/workflows/sdk-export-sort-once.yml
          git commit -m 'fix(ui): sort Sheet SDK export'
          git push origin HEAD:claude/p3-m4a-ui-design-system-01
