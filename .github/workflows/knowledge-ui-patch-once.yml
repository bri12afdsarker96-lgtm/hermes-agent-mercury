name: Knowledge UI patch once

on:
  push:
    branches:
      - claude/p3-m4a-ui-design-system-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: claude/p3-m4a-ui-design-system-01
          fetch-depth: 0

      - name: Patch presentation only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/desktop/src/plugins/enterprise-console/page-knowledge.tsx')
          s = p.read_text(encoding='utf-8')

          old_import = "import { CapabilityBadge } from './status-badge'"
          new_import = "import { CapabilityBadge, PageStatusBadge } from './status-badge'\nimport { PageHeader } from './ui'"
          assert s.count(old_import) == 1, 'status-badge import drifted'
          s = s.replace(old_import, new_import)

          marker = '// ── Page ───────────────────────────────────────────────────────────────────\n\n'
          assert s.count(marker) == 1, 'page marker drifted'
          prefix, _ = s.split(marker, 1)
          new_page = '''export function KnowledgePage() {
            const status = capabilityStatus(useValue($whoami), 'knowledge_rag')

            return (
              <div
                className="mx-auto flex w-full max-w-[96rem] flex-col px-(--ec-page-inset-x) py-(--ec-page-inset-y)"
                data-page-status="ready-dev"
                data-testid="console-page-knowledge"
              >
                <PageHeader
                  purpose="Review knowledge gaps, stage sources, preview chunks and publish through authoritative server workflows."
                  status={<PageStatusBadge status="ready-dev" />}
                  title="Enterprise knowledge"
                />

                {status && status !== 'LIVE' ? (
                  <div
                    className="mb-(--ec-gutter) flex items-center gap-2 rounded-(--ec-panel-radius) border border-(--ui-stroke-secondary) bg-(--ui-bg-card) px-3 py-2 text-(--ui-text-secondary)"
                    data-testid="console-knowledge-dev"
                  >
                    <CapabilityBadge status={status} />
                    <span>knowledge RAG is not production-live on this server</span>
                  </div>
                ) : null}

                <div className="grid items-start gap-(--ec-gutter) xl:grid-cols-2">
                  <div className="flex min-w-0 flex-col gap-(--ec-gutter)">
                    <UploadsSection />
                    <SourcesSection />
                  </div>
                  <CandidatesSection />
                </div>
              </div>
            )
          }
          '''
          s = prefix + marker + new_page

          for required in [
              'permission="kb.upload"',
              'permission="kb.commit"',
              'permission="kb.delete"',
              'permission="kb.author"',
              "transport.upload('/api/knowledge-upload'",
              "transport.post('/api/knowledge-commit'",
              "transport.post('/api/knowledge-rollback'",
              "transport.post('/api/knowledge-delete'",
          ]:
              assert required in s, f'missing authority invariant: {required}'

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit production page and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/plugins/enterprise-console/page-knowledge.tsx
          git rm .github/workflows/knowledge-ui-patch-once.yml
          git commit -m 'feat(ui): compose enterprise knowledge presentation'
          git push origin HEAD:claude/p3-m4a-ui-design-system-01
