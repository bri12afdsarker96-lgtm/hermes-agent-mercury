name: Vendor Source Han Sans CN once

on:
  push:
    branches:
      - claude/p3-m4a-ui-design-system-01

permissions:
  contents: write

jobs:
  vendor-font:
    if: ${{ !contains(github.event.head_commit.message, '[font-vendor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: claude/p3-m4a-ui-design-system-01
          fetch-depth: 0

      - name: Download exact Adobe Source Han Sans CN 2.005R asset
        shell: bash
        run: |
          set -euo pipefail
          FONT_PATH='apps/desktop/src/fonts/SourceHanSansCN-VF.woff2'
          LICENSE_PATH='apps/desktop/src/fonts/LICENSE-SourceHanSansCN.txt'
          mkdir -p "$(dirname "$FONT_PATH")"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/adobe-fonts/source-han-sans/2.005R/Variable/WOFF2/OTF/Subset/SourceHanSansCN-VF.otf.woff2' \
            --output "$FONT_PATH"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/adobe-fonts/source-han-sans/2.005R/LICENSE.txt' \
            --output "$LICENSE_PATH"

          test "$(git hash-object "$FONT_PATH")" = 'f87772cec1747734cbea16204ae99e4f2cc06713'
          test "$(git hash-object "$LICENSE_PATH")" = '3ff0ccaba06857bf292ade9a50f16a0f02b3b8d4'

      - name: Commit verified asset and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/fonts/SourceHanSansCN-VF.woff2 \
                  apps/desktop/src/fonts/LICENSE-SourceHanSansCN.txt
          git rm .github/workflows/vendor-source-han-cn-once.yml
          git commit -m 'chore(ui): vendor verified Source Han Sans CN 2.005R [font-vendor]'
          git push origin HEAD:claude/p3-m4a-ui-design-system-01
