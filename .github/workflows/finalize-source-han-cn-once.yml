name: Finalize Source Han Sans CN once

on:
  push:
    branches:
      - claude/p3-m4a-ui-design-system-01

permissions:
  contents: write

jobs:
  finalize-font:
    if: ${{ !contains(github.event.head_commit.message, '[source-han-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: claude/p3-m4a-ui-design-system-01
          fetch-depth: 0

      - name: Activate verified Adobe Source Han Sans CN
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object apps/desktop/src/fonts/SourceHanSansCN-VF.woff2)" = 'f87772cec1747734cbea16204ae99e4f2cc06713'
          test "$(git hash-object apps/desktop/src/fonts/LICENSE-SourceHanSansCN.txt)" = '3ff0ccaba06857bf292ade9a50f16a0f02b3b8d4'

          python - <<'PY'
          from pathlib import Path
          import re

          styles = Path('apps/desktop/src/styles.css')
          s = styles.read_text(encoding='utf-8')
          pattern = re.compile(r"/\* Noto Sans SC .*?\n@theme inline \{", re.S)
          matches = pattern.findall(s)
          assert len(matches) == 1, f'expected one legacy CJK font block, found {len(matches)}'
          replacement = """/* Source Han Sans CN (思源黑体) — exact Adobe 2.005R CN subset variable WOFF2.\n   Source: adobe-fonts/source-han-sans tag 2.005R,\n   Variable/WOFF2/OTF/Subset/SourceHanSansCN-VF.otf.woff2.\n   SIL OFL-1.1; see ./fonts/LICENSE-SourceHanSansCN.txt. Bundled locally,\n   never fetched at runtime. The Enterprise Console opts in; core typography\n   remains host-owned. A single variable file covers the approved UI's 400–700\n   weights without shipping duplicate static CJK fonts. */\n@font-face {\n  font-family: 'Source Han Sans CN';\n  font-style: normal;\n  font-weight: 200 900;\n  font-display: swap;\n  src: url('./fonts/SourceHanSansCN-VF.woff2') format('woff2');\n}\n\n@theme inline {"""
          s = pattern.sub(replacement, s)
          styles.write_text(s, encoding='utf-8')

          console = Path('apps/desktop/src/plugins/enterprise-console/ui/console.css')
          c = console.read_text(encoding='utf-8')
          old = """  /* -- Typography --------------------------------------------------------\n     Source Han Sans SC, shipped as Google's OFL build (Noto Sans SC). Scoped\n     to the console so core surfaces keep the host's own sans. The system stack\n     stays behind it for any glyph the subset misses. */\n  font-family: 'Noto Sans SC', var(--dt-font-sans);"""
          new = """  /* -- Typography --------------------------------------------------------\n     Exact Adobe Source Han Sans CN 2.005R (思源黑体), bundled locally under\n     OFL-1.1. Scoped to the console so core surfaces keep the host's own sans.\n     The host system stack remains the final fallback. */\n  font-family: 'Source Han Sans CN', var(--dt-font-sans);"""
          assert old in c, 'expected legacy console typography block missing'
          console.write_text(c.replace(old, new), encoding='utf-8')

          census = Path('apps/desktop/docs/enterprise-console/UI_REUSE_CENSUS.md')
          d = census.read_text(encoding='utf-8')
          d = d.replace(
              '| `fonts/` — RTWS ShangGo G0 | 13 MB of TTFs for a commercial CJK family with **no licence file anywhere in the package**. Rejected for distribution. Replaced by Source Han Sans SC under OFL-1.1 — see below |',
              '| `fonts/` — RTWS ShangGo G0 | 13 MB of TTFs for a commercial CJK family with **no licence file anywhere in the package**. Rejected for distribution. Replaced by exact Adobe Source Han Sans CN under OFL-1.1 — see below |'
          )
          start = d.index('## Typography')
          end = d.index('## Function truth is unchanged by this layer')
          typography = """## Typography\n\nThe design's brand face is rejected for licensing. The approved replacement is\n**Source Han Sans CN (思源黑体)** from Adobe's official `adobe-fonts/source-han-sans`\nrelease **2.005R**. The bundled file is the official CN region-specific variable\nWOFF2 at `Variable/WOFF2/OTF/Subset/SourceHanSansCN-VF.otf.woff2`, stored locally\nas `src/fonts/SourceHanSansCN-VF.woff2`; the upstream Git blob SHA is\n`f87772cec1747734cbea16204ae99e4f2cc06713`. The accompanying Adobe OFL-1.1\nlicense is `src/fonts/LICENSE-SourceHanSansCN.txt` (upstream blob\n`3ff0ccaba06857bf292ade9a50f16a0f02b3b8d4`). No runtime CDN is used.\n\nOne variable file covers the approved UI's 400–700 weights and avoids shipping\nduplicate static CJK font binaries. Only the Enterprise Console opts in through\n`ui/console.css`; core Mercury typography remains unchanged. No substitute font\nis renamed or aliased to the Source Han family.\n\n"""
          census.write_text(d[:start] + typography + d[end:], encoding='utf-8')

          design = Path('apps/desktop/DESIGN.md')
          g = design.read_text(encoding='utf-8')
          old_design = """- **Noto Sans SC** (SIL OFL-1.1, `src/fonts/LICENSE-NotoSansSC.txt`) is the\n  bundled CJK face — Google's release of Adobe's Source Han Sans SC (思源黑体).\n  Four subsets, CJK and Latin at 400/700; the Latin subset declares a\n  `unicode-range` so Latin text renders from the 13 KB file rather than the\n  1.1 MB one. Only two weights ship because CSS weight matching already\n  resolves 500 → 400 and 600 → 700.\n"""
          new_design = """- **Source Han Sans CN / 思源黑体** (SIL OFL-1.1,\n  `src/fonts/LICENSE-SourceHanSansCN.txt`) is the bundled CJK face, taken from\n  Adobe's official `adobe-fonts/source-han-sans` 2.005R release. The exact CN\n  region-specific variable WOFF2 is stored as `src/fonts/SourceHanSansCN-VF.woff2`\n  and covers the approved UI's 400–700 weights in one file.\n"""
          assert old_design in g, 'expected DESIGN.md legacy CJK block missing'
          design.write_text(g.replace(old_design, new_design), encoding='utf-8')

          provenance = Path('apps/desktop/docs/enterprise-console/SOURCE_HAN_SANS_CN_PROVENANCE.md')
          provenance.write_text("""# Source Han Sans CN provenance\n\n- Family: **Source Han Sans CN / 思源黑体**\n- Upstream: `adobe-fonts/source-han-sans`\n- Release: `2.005R`\n- Upstream path: `Variable/WOFF2/OTF/Subset/SourceHanSansCN-VF.otf.woff2`\n- Bundled path: `src/fonts/SourceHanSansCN-VF.woff2`\n- Upstream Git blob SHA: `f87772cec1747734cbea16204ae99e4f2cc06713`\n- License: SIL Open Font License 1.1\n- License upstream Git blob SHA: `3ff0ccaba06857bf292ade9a50f16a0f02b3b8d4`\n- Runtime network dependency: **none**\n- Scope: Enterprise Console only\n\nThe binary and license were fetched by GitHub Actions from the exact Adobe\n`2.005R` tag and accepted only after `git hash-object` matched the upstream blob\nSHAs above. No substitute asset is renamed or aliased to this family.\n""", encoding='utf-8')
          PY

          rm -f \
            apps/desktop/src/fonts/LICENSE-NotoSansSC.txt \
            apps/desktop/src/fonts/noto-sans-sc-chinese-simplified-400-normal.woff2 \
            apps/desktop/src/fonts/noto-sans-sc-chinese-simplified-700-normal.woff2 \
            apps/desktop/src/fonts/noto-sans-sc-latin-400-normal.woff2 \
            apps/desktop/src/fonts/noto-sans-sc-latin-700-normal.woff2

          if git grep -n -I -E 'Noto Sans SC|noto-sans-sc|LICENSE-NotoSansSC' -- apps/desktop; then
            echo 'stale substitute-font reference remains' >&2
            exit 1
          fi

      - name: Commit activation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/desktop/src/styles.css \
                     apps/desktop/src/fonts \
                     apps/desktop/src/plugins/enterprise-console/ui/console.css \
                     apps/desktop/docs/enterprise-console/UI_REUSE_CENSUS.md \
                     apps/desktop/docs/enterprise-console/SOURCE_HAN_SANS_CN_PROVENANCE.md \
                     apps/desktop/DESIGN.md
          git rm .github/workflows/finalize-source-han-cn-once.yml
          git commit -m 'fix(ui): use exact Adobe Source Han Sans CN 2.005R [source-han-final]'
          git push origin HEAD:claude/p3-m4a-ui-design-system-01
