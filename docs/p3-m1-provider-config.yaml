# P3-M1 China primary/fallback provider contract.
#
# Copy these non-secret settings into ~/.hermes/config.yaml. Store the two
# credentials only in ~/.hermes/.env (or through `hermes model` / Desktop
# Settings); never add API-key values to this file.
model:
  default: MiniMax-M3
  provider: minimax-cn
  base_url: https://api.minimaxi.com/anthropic
  api_mode: anthropic_messages

fallback_providers:
  - provider: deepseek
    model: deepseek-v4-flash
