# Hermes Enterprise public TLS gateway.
# This file is deliberately secret-free.  Replace only the loopback ports when
# the corresponding local service contract changes.

server {
    listen 80;
    listen [::]:80;
    server_name agent.qiqiaoban.top enterprise.qiqiaoban.top login.qiqiaoban.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enterprise.qiqiaoban.top;
    ssl_certificate /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name login.qiqiaoban.top;
    ssl_certificate /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.qiqiaoban.top;
    ssl_certificate /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes-enterprise-qiqiaoban/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18765;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
